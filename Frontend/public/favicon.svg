<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">

  <!-- White circle background with subtle drop-shadow ring -->
  <circle cx="32" cy="32" r="30" fill="#ffffff"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#e2f0e8" stroke-width="1"/>

  <!-- ══ WALLET BODY ══ -->
  <!-- Main wallet rectangle, dark green leather -->
  <rect x="10" y="24" width="40" height="26" rx="4" fill="#0f5c3a"/>
  <!-- Lighter face highlight to give 3-D leather look -->
  <rect x="10" y="24" width="40" height="12" rx="4" fill="#145c3f"/>
  <!-- Top flap (open wallet top edge) -->
  <rect x="12" y="22" width="36" height="6" rx="2.5" fill="#1a7a54"/>
  <!-- Stitching line top -->
  <line x1="14" y1="25.5" x2="50" y2="25.5" stroke="#2a9e6e" stroke-width="0.8" stroke-dasharray="2.5 2"/>

  <!-- ══ CARD sticking out of wallet ══ -->
  <!-- Card body -->
  <rect x="30" y="14" width="18" height="12" rx="2" fill="#155c3c" transform="rotate(-4 39 20)"/>
  <!-- Card stripe -->
  <rect x="31" y="15.5" width="16" height="3" rx="0.8" fill="#1e7a50" transform="rotate(-4 39 17)"/>
  <!-- Chip -->
  <rect x="32" y="20" width="5" height="4" rx="1" fill="#f6b430" transform="rotate(-4 34.5 22)"/>

  <!-- ══ GLOBE embossed on wallet face ══ -->
  <circle cx="28" cy="37" r="7" fill="none" stroke="#1e7a54" stroke-width="1.3"/>
  <!-- Equator line -->
  <ellipse cx="28" cy="37" rx="7" ry="3.5" fill="none" stroke="#1e7a54" stroke-width="0.9"/>
  <!-- Meridian line -->
  <line x1="28" y1="30" x2="28" y2="44" stroke="#1e7a54" stroke-width="0.9"/>

  <!-- ══ GOLD COIN ══ -->
  <!-- Coin outer ring -->
  <circle cx="26" cy="25" r="11" fill="#e8960a"/>
  <!-- Coin main face -->
  <circle cx="26" cy="25" r="9.5" fill="#f6b430"/>
  <!-- Coin inner ring groove -->
  <circle cx="26" cy="25" r="7.8" fill="none" stroke="#e8960a" stroke-width="0.8"/>
  <!-- Coin face highlight -->
  <circle cx="23.5" cy="22.5" r="3.5" fill="#fde68a" opacity="0.5"/>
  <!-- Dollar sign — $ symbol -->
  <text x="26" y="30" font-family="Arial Black, Arial, sans-serif" font-size="10" font-weight="900"
        fill="#b45309" text-anchor="middle" dominant-baseline="auto">$</text>

  <!-- ══ WALLET CLASP / BUTTON ══ -->
  <!-- Clasp strap -->
  <rect x="46" y="31" width="6" height="9" rx="2" fill="#1a7a54"/>
  <!-- Clasp button (gold stud) -->
  <circle cx="49" cy="39.5" r="2.8" fill="#e8960a"/>
  <circle cx="49" cy="39.5" r="1.8" fill="#f6b430"/>

  <!-- ══ SWIRL / ORBIT arrow (simplified) ══ -->
  <!-- Left arc -->
  <path d="M12 34 Q7 38 12 43" stroke="#22c55e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="12,43 9,40 14.5,40.5" fill="#22c55e"/>
  <!-- Right arc -->
  <path d="M52 28 Q57 32 52 37" stroke="#22c55e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="52,37 49.5,34.5 55,34" fill="#22c55e"/>

</svg>
