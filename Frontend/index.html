<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus Coin - NextGen BudgetBee. A student-first budgeting and expense-tracking platform." />
    <title>Campus Coin | NextGen BudgetBee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      #tawk-chat-toggle {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 9999;
        display: inline-flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, #15803d 0%, #22c55e 100%);
        color: #ffffff;
        box-shadow: 0 14px 28px rgba(21, 128, 61, 0.28);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      #tawk-chat-toggle:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 32px rgba(21, 128, 61, 0.34);
      }

      #tawk-chat-toggle:focus-visible {
        outline: 3px solid #86efac;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        #tawk-chat-toggle {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <button
      id="tawk-chat-toggle"
      type="button"
      aria-label="Open chat support"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 18.5V16H5.5C3.57 16 2 14.43 2 12.5V7.5C2 5.57 3.57 4 5.5 4H18.5C20.43 4 22 5.57 22 7.5V12.5C22 14.43 20.43 16 18.5 16H11L7 18.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8.5 9.5H15.5M8.5 12.5H13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <script type="module" src="/src/main.tsx"></script>

    <!--Start of Tawk.to Script-->
    <script type="text/javascript">
      window.Tawk_API = window.Tawk_API || {};
      window.Tawk_API.onLoad = function () {
        if (typeof window.Tawk_API.hideWidget === 'function') {
          window.Tawk_API.hideWidget();
        }
      };

      document.getElementById('tawk-chat-toggle')?.addEventListener('click', function () {
        if (typeof window.Tawk_API.toggle === 'function') {
          window.Tawk_API.toggle();
          return;
        }

        if (typeof window.Tawk_API.showWidget === 'function') {
          window.Tawk_API.showWidget();
        }
      });

      var Tawk_LoadStart = new Date();
      (function () {
        var script = document.createElement('script');
        var firstScript = document.getElementsByTagName('script')[0];
        script.async = true;
        script.src = 'https://embed.tawk.to/6ab60daff74c113446a800dc/1k3biatf4';
        script.charset = 'UTF-8';
        script.setAttribute('crossorigin', '*');
        firstScript.parentNode.insertBefore(script, firstScript);
      })();
    </script>
    <!--End of Tawk.to Script-->
  </body>
</html>
