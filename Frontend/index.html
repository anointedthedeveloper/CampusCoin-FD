<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Campus Coin - NextGen BudgetBee. A student-first budgeting and expense-tracking platform."
    />
    <title>Campus Coin | NextGen BudgetBee</title>
    <link rel="preload" href="/fonts/naira-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme (light unless the visitor chose dark) before first paint, so the boot
      // loader and first frame never flash the wrong mode. Keep the storage
      // key in sync with THEME_STORAGE_KEY in src/contexts/ThemeContext.tsx.
      (function () {
        try {
          var isDark = localStorage.getItem('campus-coin.theme-choice') === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
        } catch (_) {
          // ignore storage access failures (e.g. private browsing)
        }
      })();
    </script>
    <style>
      /* The Naira sign (₦) in Plus Jakarta Sans has a single bar; this face
         supplies a proper double-barred ₦ (from Inter) for that one
         character only — unicode-range keeps every other glyph unchanged. */
      @font-face { font-family: 'Naira'; src: url('/fonts/naira-400.woff2') format('woff2'); font-weight: 100 450; font-style: normal; font-display: swap; unicode-range: U+20A6; }
      @font-face { font-family: 'Naira'; src: url('/fonts/naira-500.woff2') format('woff2'); font-weight: 451 550; font-style: normal; font-display: swap; unicode-range: U+20A6; }
      @font-face { font-family: 'Naira'; src: url('/fonts/naira-600.woff2') format('woff2'); font-weight: 551 650; font-style: normal; font-display: swap; unicode-range: U+20A6; }
      @font-face { font-family: 'Naira'; src: url('/fonts/naira-700.woff2') format('woff2'); font-weight: 651 750; font-style: normal; font-display: swap; unicode-range: U+20A6; }
      @font-face { font-family: 'Naira'; src: url('/fonts/naira-800.woff2') format('woff2'); font-weight: 751 900; font-style: normal; font-display: swap; unicode-range: U+20A6; }

      #initial-page-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 4px;
        background: #e5f1e8;
        color: #176c42;
        font-family: 'Plus Jakarta Sans', sans-serif;
        text-align: center;
      }

      html.dark #initial-page-loader {
        background: #071c14;
        color: #f1f7f3;
      }

      #initial-page-loader .loader-coin-wrap {
        position: relative;
        width: 64px;
        height: 80px;
      }

      #initial-page-loader .loader-coin {
        position: absolute;
        top: 0;
        left: 50%;
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, #6ee7a8 0%, #16a34a 55%, #0f5c30 100%);
        color: #fff;
        font-family: 'Naira', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 26px;
        font-weight: 800;
        box-shadow:
          inset 0 0 0 2px #0b3b20,
          inset 0 0 0 7px rgba(255, 255, 255, 0.28),
          0 8px 14px rgba(0, 0, 0, 0.24);
        transform: translateX(-50%);
        animation: initial-loader-flip 1.2s ease-in-out infinite;
      }

      #initial-page-loader .loader-shadow {
        position: absolute;
        bottom: 4px;
        left: 50%;
        width: 36px;
        height: 8px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.3);
        filter: blur(3px);
        transform: translateX(-50%);
        animation: initial-loader-shadow 1.2s ease-in-out infinite;
      }

      #initial-page-loader .loader-name {
        margin: 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      #initial-page-loader .loader-message {
        margin: 0;
        color: #5c7568;
        font-size: 14px;
      }

      html.dark #initial-page-loader .loader-message {
        color: #a8bbb1;
      }

      @keyframes initial-loader-flip {
        0%,
        100% {
          transform: translateX(-50%) rotateY(0deg) translateY(0);
        }
        50% {
          transform: translateX(-50%) rotateY(180deg) translateY(-5px);
        }
      }

      @keyframes initial-loader-shadow {
        50% {
          transform: translateX(-50%) scaleX(0.75);
          opacity: 0.55;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-page-loader .loader-coin,
        #initial-page-loader .loader-shadow {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-page-loader" role="status" aria-live="polite" aria-label="Loading Campus Coin">
      <div class="loader-coin-wrap" aria-hidden="true">
        <span class="loader-coin">₦</span>
        <span class="loader-shadow"></span>
      </div>
      <p class="loader-name">CAMPUS COIN</p>
      <p class="loader-message">Getting your campus wallet ready</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
