<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Campus Coin - NextGen BudgetBee. A student-first budgeting and expense-tracking platform."
    />
    <title>Campus Coin | NextGen BudgetBee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      #tawk-chat-toggle {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 9999;
        display: inline-flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border: 2px solid #ffffff;
        border-radius: 50%;
        background: #ffffff;
        color: #168c50;
        box-shadow:
          0 0 0 1px rgba(21, 128, 61, 0.12),
          0 14px 28px rgba(21, 128, 61, 0.22);
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      #tawk-chat-toggle:hover {
        transform: translateY(-2px);
        box-shadow:
          0 0 0 1px rgba(21, 128, 61, 0.12),
          0 18px 32px rgba(21, 128, 61, 0.3);
      }

      #tawk-chat-toggle:focus-visible {
        outline: 3px solid #86efac;
        outline-offset: 3px;
      }

      #initial-page-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: #e5f1e8;
        color: #176c42;
        font-family: 'Plus Jakarta Sans', sans-serif;
        text-align: center;
      }

      #initial-page-loader .loader-mark {
        width: 54px;
        height: 54px;
        border: 3px solid #b8ddc4;
        border-top-color: #168c50;
        border-radius: 50%;
        animation: initial-loader-spin 0.8s linear infinite;
      }

      #initial-page-loader .loader-name {
        margin: 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      #initial-page-loader .loader-message {
        margin: -12px 0 0;
        color: #5c7568;
        font-size: 14px;
      }

      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #tawk-chat-toggle,
        #initial-page-loader .loader-mark {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-page-loader" role="status" aria-live="polite" aria-label="Loading Campus Coin">
      <span class="loader-mark" aria-hidden="true"></span>
      <p class="loader-name">CAMPUS COIN</p>
      <p class="loader-message">Getting your campus wallet ready</p>
    </div>
    <div id="root"></div>
    <button id="tawk-chat-toggle" type="button" aria-label="Open chat support">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M7 18.5V16H5.5C3.57 16 2 14.43 2 12.5V7.5C2 5.57 3.57 4 5.5 4H18.5C20.43 4 22 5.57 22 7.5V12.5C22 14.43 20.43 16 18.5 16H11L7 18.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M8.5 9.5H15.5M8.5 12.5H13.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <script type="module" src="/src/main.tsx"></script>

    <!--Start of Tawk.to Script-->
    <script type="text/javascript">
      var campusCoinPageTitle = document.title;
      var restoreCampusCoinTitle = function () {
        if (document.title !== campusCoinPageTitle) {
          document.title = campusCoinPageTitle;
        }
      };

      var pageTitleObserver = new MutationObserver(function () {
        if (document.visibilityState === 'visible') {
          restoreCampusCoinTitle();
        }
      });
      pageTitleObserver.observe(document.querySelector('title'), {
        childList: true,
        characterData: true,
        subtree: true,
      });
      window.addEventListener('focus', restoreCampusCoinTitle);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          restoreCampusCoinTitle();
        }
      });

      window.Tawk_API = window.Tawk_API || {};
      window.Tawk_API.onLoad = function () {
        if (typeof window.Tawk_API.hideWidget === 'function') {
          window.Tawk_API.hideWidget();
        }
      };

      document.getElementById('tawk-chat-toggle')?.addEventListener('click', function () {
        if (typeof window.Tawk_API.toggle === 'function') {
          window.Tawk_API.toggle();
          return;
        }

        if (typeof window.Tawk_API.showWidget === 'function') {
          window.Tawk_API.showWidget();
        }
      });

      var Tawk_LoadStart = new Date();
      (function () {
        var script = document.createElement('script');
        var firstScript = document.getElementsByTagName('script')[0];
        script.async = true;
        script.src = 'https://embed.tawk.to/6ab60daff74c113446a800dc/1k3biatf4';
        script.charset = 'UTF-8';
        script.setAttribute('crossorigin', '*');
        firstScript.parentNode.insertBefore(script, firstScript);
      })();
    </script>
    <!--End of Tawk.to Script-->
  </body>
</html>
